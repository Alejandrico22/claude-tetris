<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <button id="theme-toggle-btn" class="theme-toggle-btn" title="Cambiar tema">☀️ Claro</button>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- Pantalla de inicio: se muestra al cargar la página, antes de la primera partida -->
    <div id="screen-start" class="overlay">
      <div class="overlay-box">
        <p class="screen-title">TETRIS</p>
        <button id="play-btn" class="primary-btn">Jugar</button>
      </div>
    </div>

    <!-- Menú de pausa: game.js lo muestra/oculta con showScreen()/hideScreens() -->
    <div id="screen-pause" class="overlay hidden">
      <div class="overlay-box" id="pause-content">
        <p class="screen-title">PAUSA</p>

        <!-- Opciones principales del menú de pausa -->
        <div id="pause-main" class="pause-view">
          <button id="pause-resume-btn" class="primary-btn">Reanudar</button>
          <button id="pause-restart-btn" class="primary-btn">Reiniciar</button>

          <div class="pause-field">
            <label for="start-level-select">Nivel inicial</label>
            <select id="start-level-select">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
            </select>
          </div>

          <button id="pause-controls-btn" class="secondary-btn">Ver controles</button>
        </div>

        <!-- Sub-vista: lista de controles (permanece dentro del menú de pausa) -->
        <div id="pause-controls" class="pause-view hidden">
          <div class="controls">
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
            </ul>
          </div>
          <button id="pause-controls-back-btn" class="secondary-btn">Volver</button>
        </div>
      </div>
    </div>

    <!-- Pantalla de fin de partida -->
    <div id="screen-gameover" class="overlay hidden">
      <div class="overlay-box">
        <p class="screen-title">GAME OVER</p>
        <p id="gameover-score"></p>
        <button id="restart-btn" class="primary-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
