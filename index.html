<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <button id="theme-toggle-btn" class="theme-toggle-btn" title="Cambiar tema">☀️ Claro</button>
          <div class="skin-select-wrap">
            <label for="skin-select" class="label">SKIN</label>
            <!-- Opciones generadas dinámicamente en game.js a partir del registro SKINS -->
            <select id="skin-select"></select>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- Pantalla de inicio: se muestra al cargar la página, antes de la primera partida -->
    <div id="screen-start" class="overlay">
      <div class="overlay-box">
        <p class="screen-title">TETRIS</p>
        <button id="play-btn" class="primary-btn">Jugar</button>
      </div>
    </div>

    <!-- Menú de pausa: game.js lo muestra/oculta con showScreen()/hideScreens() -->
    <div id="screen-pause" class="overlay hidden">
      <div class="overlay-box" id="pause-content">
        <p class="screen-title">PAUSA</p>
      </div>
    </div>

    <!-- Pantalla de fin de partida -->
    <div id="screen-gameover" class="overlay hidden">
      <div class="overlay-box">
        <p class="screen-title">GAME OVER</p>
        <p id="gameover-score"></p>
        <button id="restart-btn" class="primary-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
